<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Jokenpô</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./assets/img/favicon.svg" type="image/x-icon">
</head>
<body>
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <p class="modal-result" id="modal-result"></p>
            <div class="modal-choices">
                <div class="modal-player" id="modal-player">
                    <p>Você</p>
                    <img id="img-human" src="" alt="sua escolha">
                </div>
                <span class="modal-vs">VS</span>
                <div class="modal-player" id="modal-machine">
                    <p>Máquina</p>
                    <img id="img-machine" src="" alt="escolha da máquina">
                </div>
            </div>
            <button class="modal-close" id="modal-close" onclick="closeModal()">Jogar de novo</button>
        </div>
    </div>

    <main class="container">
        <h1>Pokémon Jokenpô</h1>
        
        <button onclick="playHuman('fogo')" class="icones-button" id="fogo">
            <img id="img-btn-fogo" src="" class="icones-img" alt="Fogo (Charmander)">
        </button>
        
        <button onclick="playHuman('agua')" class="icones-button" id="agua">
            <img id="img-btn-agua" src="" class="icones-img" alt="Água (Squirtle)">
        </button>
        
        <button onclick="playHuman('planta')" class="icones-button" id="planta">
            <img id="img-btn-planta" src="" class="icones-img" alt="Planta (Bulbasaur)">
        </button>

        <p class="result"></p>
        
        <div class="conteiner-score">
            <p class="your-score">Sua Pontuação:</p><span id="youcore" class="score">0</span>
        </div>
        <div class="conteiner-score">
            <p class="machine-score">Pontuação da Máquina:</p><span id="machinecore" class="score">0</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
